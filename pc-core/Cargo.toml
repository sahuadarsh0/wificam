[package]
name = "pc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core protocol, security, audio DSP, video decoding, and transport engine for WifiCam."

[dependencies]
aes-gcm = "0.11"
base64 = "0.23"
bytes = "1.12"
getrandom = "0.4"
hkdf = "0.13"
p256 = { version = "0.14", features = ["ecdh", "pkcs8"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
zeroize = { version = "1.9", features = ["derive"] }
